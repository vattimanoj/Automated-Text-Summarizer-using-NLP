services:
  # Backend Service
  - type: web
    name: text-summarizer-backend
    env: python
    plan: free
    buildCommand: "cd backend && pip install --upgrade pip && pip install torch==2.3.1+cpu torchvision==0.18.1+cpu --extra-index-url https://download.pytorch.org/whl/cpu && pip install -r requirements.txt"
    startCommand: "cd backend && gunicorn app.main:app -w 1 -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT --timeout 120"
    envVars:
      - key: ENV
        value: production
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        fromDatabase:
          name: text-summarizer-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: "https://text-summarizer-frontend.onrender.com" # Replace after first deployment

  # Frontend Service (Static Site)
  - type: web
    name: text-summarizer-frontend
    runtime: static
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: frontend/build
    envVars:
      - key: REACT_APP_API_URL
        value: "https://text-summarizer-backend.onrender.com"

databases:
  - name: text-summarizer-db
    databaseName: summarizer
    user: admin
    plan: free
