services:
  # Backend Service
  - type: web
    name: text-summarizer-backend
    env: python
    buildCommand: "cd backend && pip install -r requirements.txt"
    startCommand: "cd backend && gunicorn app.main:app -w 4 -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT"
    envVars:
      - key: ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: text-summarizer-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: "https://text-summarizer-frontend.onrender.com" # Replace after first deployment

  # Frontend Service (Static Site)
  - type: web
    name: text-summarizer-frontend
    env: node
    buildCommand: "cd frontend && npm install && npm run build"
    publishPath: frontend/build
    envVars:
      - key: REACT_APP_API_URL
        value: "https://text-summarizer-backend.onrender.com"

databases:
  - name: text-summarizer-db
    databaseName: summarizer
    user: admin
    plan: free
